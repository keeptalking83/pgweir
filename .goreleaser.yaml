version: 2

project_name: pgweir

before:
  hooks:
    - go mod tidy

builds:
  - id: pgweir
    main: ./cmd/pgweir
    binary: pgweir
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/keeptalking83/pgweir/internal/meta.Version={{ .Version }}
      - -X github.com/keeptalking83/pgweir/internal/meta.Commit={{ .Commit }}
      - -X github.com/keeptalking83/pgweir/internal/meta.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - NON-GOALS.md
      - SECURITY.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
