version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errcheck
    - gosec
  settings:
    gosec:
      excludes:
        # Integer conversions between LSNs, leaf indices and tree sizes are
        # range-checked where values enter the program.
        - G115
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
